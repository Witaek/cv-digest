server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve .git or other dotfiles
    location ~ /\. { deny all; return 404; }

    # Digests and the index change daily; always revalidate
    location ~* \.(md|json)$ { add_header Cache-Control "no-cache"; types { text/markdown md; application/json json; } }
}
